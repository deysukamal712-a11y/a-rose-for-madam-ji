<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For Madam Ji 🌹</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030205;
      font-family: Georgia, "Times New Roman", serif;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.48) 100%);
    }

    #introText, #instruction, #message, #finalMessage {
      position: fixed;
      z-index: 10;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 90vw);
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,.9);
      pointer-events: none;
    }

    #introText {
      top: 8%;
      font-size: clamp(20px, 3vw, 34px);
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #instruction {
      bottom: 8%;
      font-size: clamp(17px, 2.4vw, 27px);
      letter-spacing: .04em;
      opacity: 0;
      transition: opacity .8s ease;
    }

    #message {
      bottom: 17%;
      font-size: clamp(19px, 2.7vw, 31px);
      line-height: 1.45;
      opacity: 0;
      transition: opacity .45s ease;
      max-width: 760px;
    }

    #finalMessage {
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(21px, 3vw, 35px);
      line-height: 1.55;
      max-width: 850px;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #musicBtn {
      position: fixed;
      z-index: 20;
      right: 18px;
      top: 18px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.35);
      color: white;
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    #startHint {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.7);
      font-size: 12px;
      pointer-events: none;
      transition: opacity .6s;
    }

    .blurred { filter: blur(5px); transition: filter .8s ease; }
    .clear { filter: blur(0); transition: filter 1s ease; }

    @media (max-width: 600px) {
      #musicBtn { right: 10px; top: 10px; padding: 9px 12px; }
      #instruction { bottom: 7%; }
      #message { bottom: 16%; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="introText"></div>
<div id="instruction">Touch every petal 🌹</div>
<div id="message"></div>
<div id="finalMessage">
  See? Even after every petal fell down, the rose showed up again...<br><br>
  Just the way I will show up every time whenever you're in trouble, my baby girl. ❤️
</div>

<button id="musicBtn">🎵 Music</button>
<div id="startHint">Touch the rose to begin</div>

<audio id="music" src="gaan.mp3" loop preload="auto"></audio>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const app = document.getElementById("app");
const instruction = document.getElementById("instruction");
const introText = document.getElementById("introText");
const message = document.getElementById("message");
const finalMessage = document.getElementById("finalMessage");
const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");
const startHint = document.getElementById("startHint");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030205);
scene.fog = new THREE.FogExp2(0x030205, 0.055);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.15, 7.4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enablePan = false;
controls.enableRotate = false;

scene.add(new THREE.AmbientLight(0x7a6070, 1.2));

const key = new THREE.DirectionalLight(0xffd2d2, 3.3);
key.position.set(-3, 5, 4);
scene.add(key);

const rim = new THREE.PointLight(0x8b001d, 8, 18);
rim.position.set(2.5, 1.7, 3);
scene.add(rim);

const glow = new THREE.PointLight(0xff9b4d, 5, 12);
glow.position.set(-3, -1, 3);
scene.add(glow);

// Background particles: tiny floating dust motes.
const dustGeo = new THREE.BufferGeometry();
const dustCount = 500;
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3] = (Math.random() - .5) * 14;
  dustPos[i*3+1] = (Math.random() - .5) * 10;
  dustPos[i*3+2] = (Math.random() - .5) * 8;
}
dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(
  dustGeo,
  new THREE.PointsMaterial({ color: 0xffc58a, size: .018, transparent: true, opacity: .55 })
);
scene.add(dust);

// Simple 3D rose made from curved/tapered petal meshes.
const roseGroup = new THREE.Group();
roseGroup.position.y = -0.2;
scene.add(roseGroup);

function petalGeometry() {
  const w = 0.62, h = 1.0;
  const segments = 7;
  const verts = [];
  const uvs = [];
  const idx = [];

  for (let j = 0; j <= segments; j++) {
    const y = j / segments;
    for (let i = 0; i <= 4; i++) {
      const x = (i / 4 - .5) * w * (0.28 + 0.72 * Math.sin(Math.PI * y));
      const curve = Math.sin(Math.PI * y) * 0.30;
      const z = curve + 0.16 * x * x;
      verts.push(x, (y - .08) * h, z);
      uvs.push(i/4, y);
    }
  }

  for (let j = 0; j < segments; j++) {
    for (let i = 0; i < 4; i++) {
      const a = j*5+i, b = a+1, c = a+5, d = c+1;
      idx.push(a,c,b, b,c,d);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const petalGeo = petalGeometry();
const petals = [];
const messages = [
  "Just like this petal fell... I fell for you too. ❤️",
  "This petal fell to remind you how gorgeous you are.",
  "One petal gone... but my love for you isn't going anywhere.",
  "If every petal is a reason to smile, you already have plenty. 🌹",
  "This little petal just wanted to say: you're beautiful.",
  "The petal fell... because even flowers can't resist you.",
  "One more petal, one more reason to tell you how special you are.",
  "It fell softly... just like you quietly became my favourite person.",
  "This petal may be gone, but you still have my heart.",
  "Even the rose is giving up its petals for you. I'm not giving up on you.",
  "A tiny petal, carrying a very big reminder: I adore you.",
  "If distance had petals, I'd remove every one until I reached you.",
  "This one fell just to tell you: keep that beautiful smile.",
  "The rose is losing petals... I'm only losing my mind over you. 😭❤️",
  "Another petal down. Still choosing you.",
  "Some things fall naturally. My feelings for you aren't one of them.",
  "The petal fell, but my promise stays.",
  "One last little reminder: you're loved, more than you know."
];

function createPetal(index, color) {
  const mat = new THREE.MeshPhysicalMaterial({
    color,
    roughness: .28,
    metalness: .02,
    transmission: .02,
    clearcoat: .55,
    clearcoatRoughness: .2,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(petalGeo, mat);
  const layer = Math.floor(index / 6);
  const angle = (index % 6) / 6 * Math.PI * 2 + layer * .35;
  const radius = .18 + layer * .14;
  const scale = 0.78 + Math.random() * .18;

  mesh.position.set(
    Math.cos(angle) * radius,
    .18 + layer * .17,
    Math.sin(angle) * radius
  );
  mesh.rotation.set(
    .25 + layer * .13,
    -angle + Math.PI,
    angle + Math.PI / 2
  );
  mesh.scale.setScalar(scale);
  mesh.userData = {
    index,
    message: messages[index % messages.length],
    baseY: mesh.position.y,
    falling: false,
    velocity: 0,
    spin: (Math.random()-.5)*.06
  };

  roseGroup.add(mesh);
  petals.push(mesh);
  return mesh;
}

const red = 0x8b001f;
for (let i = 0; i < 18; i++) createPetal(i, red);

// Inner bud to make the rose look fuller.
const budGeo = new THREE.SphereGeometry(.55, 32, 24);
const bud = new THREE.Mesh(
  budGeo,
  new THREE.MeshPhysicalMaterial({ color: red, roughness: .25, clearcoat: .6 })
);
bud.scale.set(.85, 1.05, .75);
bud.position.y = .38;
roseGroup.add(bud);

// Stem
const stem = new THREE.Mesh(
  new THREE.CylinderGeometry(.055, .08, 3.2, 20),
  new THREE.MeshStandardMaterial({ color: 0x173d1c, roughness: .7 })
);
stem.position.y = -1.35;
roseGroup.add(stem);

// Leaves
function makeLeaf(x, y, z, rz) {
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.quadraticCurveTo(.55,.18, .95,0);
  shape.quadraticCurveTo(.55,-.22,0,0);
  const geo = new THREE.ShapeGeometry(shape);
  const leaf = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({ color: 0x174b20, side: THREE.DoubleSide, roughness: .8 })
  );
  leaf.position.set(x,y,z);
  leaf.rotation.set(.25, rz, rz);
  leaf.scale.set(.8,.8,.8);
  roseGroup.add(leaf);
}
makeLeaf(-.35,-.75,.02,-.35);
makeLeaf(.38,-1.0,.02,.45);

let stage = "red";
let roseSpinning = false;
let lavenderReady = false;
let petalsTouched = 0;
let transitionStart = 0;
let redRevealProgress = 0;

function setIntro(text) {
  introText.textContent = text;
  introText.style.opacity = 1;
}
function hideIntro() { introText.style.opacity = 0; }

function startMusic() {
  music.play().then(() => {
    musicBtn.textContent = "⏸ Music";
  }).catch(() => {});
}
musicBtn.addEventListener("click", () => {
  if (music.paused) {
    startMusic();
  } else {
    music.pause();
    musicBtn.textContent = "🎵 Music";
  }
});

function startRedRoseSequence() {
  if (stage !== "red") return;
  startMusic();
  startHint.style.opacity = 0;
  stage = "transition";
  roseSpinning = true;
  transitionStart = performance.now();
  setIntro("Oops Madam Ji... this isn't your favorite flower. ❤️");
  app.classList.add("blurred");

  setTimeout(() => {
    introText.textContent = "I know... you love lavender roses. So here it is. 💜🌹";
  }, 1250);

  setTimeout(() => {
    transformToLavender();
  }, 2400);
}

function transformToLavender() {
  roseSpinning = false;
  roseGroup.rotation.y = 0;
  petals.forEach((p, i) => {
    p.material.color.setHex(0xB57EDC);
    p.material.roughness = .23;
    p.material.clearcoat = .75;
  });
  bud.material.color.setHex(0xC8A2C8);
  stage = "lavender";
  lavenderReady = true;
  app.classList.remove("blurred");
  hideIntro();
  instruction.style.opacity = 1;
  petalsTouched = 0;
}

function resetPetal(mesh) {
  mesh.userData.falling = true;
  mesh.userData.velocity = 0;
  mesh.userData.spin = (Math.random()-.5)*.18;
}

function petalTouched(mesh) {
  if (stage !== "lavender" || !lavenderReady || mesh.userData.falling) return;
  resetPetal(mesh);
  petalsTouched++;
  message.textContent = mesh.userData.message;
  message.style.opacity = 1;
  setTimeout(() => {
    message.style.opacity = 0;
  }, 2300);

  if (petalsTouched >= petals.length) {
    setTimeout(showFinalRose, 1900);
  }
}

function showFinalRose() {
  stage = "final";
  instruction.style.opacity = 0;
  message.style.opacity = 0;

  petals.forEach(p => {
    p.visible = true;
    p.position.set(
      Math.cos((p.userData.index % 6) / 6 * Math.PI*2 + Math.floor(p.userData.index/6)*.35) * (.18 + Math.floor(p.userData.index/6)*.14),
      .18 + Math.floor(p.userData.index/6)*.17,
      Math.sin((p.userData.index % 6) / 6 * Math.PI*2 + Math.floor(p.userData.index/6)*.35) * (.18 + Math.floor(p.userData.index/6)*.14)
    );
    p.rotation.set(.25 + Math.floor(p.userData.index/6)*.13, -((p.userData.index % 6) / 6 * Math.PI*2) + Math.PI, ((p.userData.index % 6) / 6 * Math.PI*2) + Math.PI/2);
    p.scale.setScalar(.78 + Math.random()*.18);
    p.userData.falling = false;
  });
  finalMessage.style.opacity = 1;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pointerDown(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
  const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);

  if (stage === "red") {
    const hits = raycaster.intersectObjects(roseGroup.children, true);
    if (hits.length) startRedRoseSequence();
    return;
  }

  if (stage === "lavender") {
    const hits = raycaster.intersectObjects(petals, false);
    if (hits.length) petalTouched(hits[0].object);
  }
}

renderer.domElement.addEventListener("pointerdown", pointerDown, {passive:true});

let last = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now-last)/1000, .05);
  last = now;

  dust.rotation.y += dt * .015;
  dust.position.x = Math.sin(now*.00018)*.08;

  if (stage === "red") {
    roseGroup.rotation.y = Math.sin(now*.0005)*.06;
    roseGroup.position.y = -.2 + Math.sin(now*.0011)*.025;
  }

  if (stage === "transition") {
    roseGroup.rotation.y += dt * 5.8;
    roseGroup.position.z = Math.min(1.0, (now-transitionStart)/1000 * .45);
    roseGroup.scale.setScalar(1 + Math.min(.12, (now-transitionStart)/1000*.06));
  }

  if (stage === "lavender" || stage === "final") {
    roseGroup.position.z += (0 - roseGroup.position.z) * .035;
    roseGroup.rotation.y = Math.sin(now*.0005)*.025;
  }

  if (stage === "lavender") {
    for (const p of petals) {
      if (p.userData.falling) {
        p.userData.velocity += 2.5 * dt;
        p.position.y -= p.userData.velocity * dt;
        p.position.x += Math.sin(now*.002 + p.userData.index)*dt*.12;
        p.rotation.x += p.userData.spin;
        p.rotation.z += p.userData.spin*.7;
        if (p.position.y < -4.5) p.visible = false;
      }
    }
  }

  if (stage === "final") {
    roseGroup.scale.setScalar(1 + Math.sin(now*.0018)*.025);
  }

  renderer.render(scene, camera);
}
animate(performance.now());

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.body.addEventListener("pointerdown", startMusic, {once:true});
</script>
</body>
</html>
